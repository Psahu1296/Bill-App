name: Deploy PhonePe Worker (production)

on:
  push:
    branches: [main]
    paths:
      - 'workers/phonepe-initiator/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to pay.sahudhaba.in
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker → production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/phonepe-initiator
          command: deploy --env production
